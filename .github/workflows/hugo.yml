name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Staticman comments can land in quick succession; only the latest push needs to deploy.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        run: |
          wget -qO "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      # Full history so enableGitInfo can set accurate lastmod dates for the sitemap.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/configure-pages@v5

      # baseURL comes from config.toml (https://yasoob.me/), same as the old Netlify build.
      - name: Build
        run: hugo

      # Netlify matched URLs case-insensitively (e.g. /arts/a1/ served /arts/A1/), GitHub Pages doesn't.
      # Publish lowercase copies of mixed-case paths, plus the /Resume.pdf spelling linked from old posts.
      - name: Add case aliases for URLs Netlify served
        shell: python3 {0}
        run: |
          import os, shutil
          for d, _, files in os.walk("public"):
              for f in files:
                  src = os.path.join(d, f)
                  dst = src.lower()
                  if dst != src and not os.path.exists(dst):
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copy2(src, dst)
          shutil.copy2("public/resume.pdf", "public/Resume.pdf")

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
